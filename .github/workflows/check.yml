name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: reference-shelf-local-build
          path: |
            dist/reference-shelf-*.zip
            dist/SHA256SUMS
